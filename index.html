ty":"南宁","message":""},{"name":"张广顺","school":"湘潭大学","major":"工程力学","city":"湘潭","message":""},{"name":"陈鸿铭","school":"长沙理工大学","major":"光电信息科学与工程","city":"长沙","message":""},{"name":"盘锦宏","school":"广西师范大学","major":"英语","city":"桂林","message":""},{"name":"孙美婷","school":"湖南工业大学","major":"材料成型及控制工程	","city":"株洲","message":""}];
const cityCoordinates={"北京":[116.4074,39.9042],"上海":[121.4737,31.2304],"天津":[117.2008,39.0842],"重庆":[106.5516,29.563],"长沙":[112.9388,28.2282],"湘潭":[112.944,27.8297],"广州":[113.2644,23.1291],"桂林":[110.2902,25.2736],"深圳":[114.0579,22.5431],"武汉":[114.3054,30.5931],"南京":[118.7969,32.0603],"杭州":[120.1551,30.2741],"成都":[104.0665,30.5723],"西安":[108.9398,34.3416],"郑州":[113.6254,34.7466],"济南":[117.1201,36.6512],"青岛":[120.3826,36.0671],"厦门":[118.0894,24.4798],"福州":[119.2965,26.0745],"南昌":[115.8582,28.6829],"合肥":[117.2272,31.8206],"昆明":[102.8329,24.8801],"贵阳":[106.6302,26.6477],"南宁":[108.3669,22.817],"海口":[110.1983,20.044],"兰州":[103.8343,36.0611],"太原":[112.5489,37.8706],"石家庄":[114.5149,38.0428],"沈阳":[123.4315,41.8057],"长春":[125.3235,43.8171],"哈尔滨":[126.5349,45.8038],"呼和浩特":[111.7492,40.8426],"银川":[106.2309,38.4872],"西宁":[101.7782,36.6171],"乌鲁木齐":[87.6168,43.8256],"拉萨":[91.1409,29.6456],"苏州":[120.5853,31.2989],"无锡":[120.3119,31.4912],"宁波":[121.5503,29.8746],"温州":[120.6994,27.9949],"佛山":[113.1214,23.0215],"东莞":[113.7518,23.0207],"珠海":[113.5767,22.2707],"惠州":[114.4162,23.1115],"徐州":[117.2841,34.2058],"扬州":[119.4129,32.3942],"泉州":[118.6759,24.8741],"烟台":[121.4479,37.4638],"洛阳":[112.454,34.6197],"宜昌":[111.2865,30.6919],"株洲":[113.134,27.8277],"岳阳":[113.1289,29.3571],"衡阳":[112.5719,26.8934],"赣州":[114.935,25.8311],"秦皇岛":[119.6005,39.9354],"常州":[119.9741,31.8112],"威海":[122.1204,37.5131],"大连":[121.6147,38.914]};
let visibleStudents=[...students];

const map=echarts.init(document.getElementById("map"));
const summary=document.getElementById("summary");
const studentList=document.getElementById("studentList");
const search=document.getElementById("search");
const loading=document.getElementById("loading");
const errorBox=document.getElementById("error");

function esc(t){
  return String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function makeMapData(list){
  const count={};
  return list.map(s=>{
    const base=cityCoordinates[s.city] || cityCoordinates["北京"];
    if(!base)return null;
    const i=count[s.city]||0;
    count[s.city]=i+1;
    const angle=i*2.4;
    const radius=i===0?0:.2+Math.floor(i/6)*.12;
    return {
      name:s.name,
      school:s.school,
      major:s.major,
      city:s.city,
      message:s.message||"",
      value:[base[0]+Math.cos(angle)*radius,base[1]+Math.sin(angle)*radius,1]
    };
  }).filter(Boolean);
}

function renderPublic(list){
  studentList.innerHTML="";
  summary.textContent=`共 ${students.length} 位同学，分布在 ${new Set(students.map(s=>s.city)).size} 个城市`;
  if(!list.length){
    studentList.innerHTML='<div class="empty">没有找到匹配的同学。</div>';
    return;
  }
  list.forEach(s=>{
    const b=document.createElement("button");
    b.className="student-card";
    b.innerHTML=`<div class="student-name">${esc(s.name)}</div><div class="student-detail">${esc(s.school)} · ${esc(s.city)}</div>`;
    b.onclick=()=>focusStudent(s);
    studentList.appendChild(b);
  });
}

function updateMap(list=students){
  visibleStudents=list;
  map.setOption({series:[{data:makeMapData(list)}]});
}

function focusStudent(s){
  const c=cityCoordinates[s.city];
  map.setOption({geo:{center:c,zoom:3}});
  const d=makeMapData(visibleStudents);
  const i=d.findIndex(x=>x.name===s.name&&x.school===s.school&&x.city===s.city);
  if(i>=0)map.dispatchAction({type:"showTip",seriesIndex:0,dataIndex:i});
}

function initMap(json){
  echarts.registerMap("china",json);
  map.setOption({
    backgroundColor:"#f5efe3",
    tooltip:{
      trigger:"item",
      backgroundColor:"rgba(255,255,255,.97)",
      borderColor:"#d8cbbb",
      borderWidth:1,
      textStyle:{color:"#2b2621"},
      formatter:p=>{
        const d=p.data;
        if(!d)return"";
        const major=d.major?`<br>专业：${esc(d.major)}`:"";
        const note=d.message?`<br><span style="color:#a94a36">${esc(d.message)}</span>`:"";
        return `<div style="min-width:190px;max-width:320px;white-space:normal"><strong style="font-size:16px">${esc(d.name)}</strong><br>${esc(d.school)}${major}<br>📍 ${esc(d.city)}${note}</div>`;
      }
    },
    geo:{
      map:"china",roam:true,zoom:1.15,scaleLimit:{min:.8,max:8},
      itemStyle:{areaColor:"#ead9b8",borderColor:"#9e8970",borderWidth:1},
      emphasis:{itemStyle:{areaColor:"#f0c987"},label:{show:false}}
    },
    series:[{
      name:"完整名单",type:"effectScatter",coordinateSystem:"geo",
      data:makeMapData(students),symbol:"pin",symbolSize:40,
      rippleEffect:{scale:2.5,brushType:"stroke"},
      itemStyle:{color:"#c94732",shadowBlur:8,shadowColor:"rgba(105,30,20,.35)"},
      label:{
        show:true,formatter:p=>p.data.name,position:"right",distance:4,
        color:"#3d3029",fontSize:12,fontWeight:"bold",
        backgroundColor:"rgba(255,255,255,.82)",padding:[3,5],borderRadius:4
      },
      zlevel:2
    }]
  });
  loading.style.display="none";
  renderPublic(students);
}

search.oninput=e=>{
  const k=e.target.value.trim().toLowerCase();
  const filtered=students.filter(s=>`${s.name} ${s.school} ${s.major} ${s.city} ${s.message}`.toLowerCase().includes(k));
  renderPublic(filtered);
  updateMap(filtered);
};

document.getElementById("resetView").onclick=()=>map.setOption({geo:{center:null,zoom:1.15}});
window.onresize=()=>map.resize();

fetch("https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json")
  .then(r=>{if(!r.ok)throw Error();return r.json();})
  .then(initMap)
  .catch(err=>{
    loading.style.display="none";
    errorBox.style.display="block";
    errorBox.textContent="地图加载失败，请检查网络连接后重新打开。";
    renderPublic(students);
    console.error(err);
  });
</script>

</body>
</html>
